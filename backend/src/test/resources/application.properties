# ===================================================================
# ClaimPilot AI - Test Profile Configuration (In-Memory H2)
# ===================================================================

spring.main.banner-mode=off

spring.datasource.url=jdbc:h2:mem:claimpilot_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

claimpilot.jwt.secret=claimpilot-test-only-secret-key-1234567890abcdef
claimpilot.jwt.expiration-ms=3600000
claimpilot.cors.allowed-origins=http://localhost:3000
claimpilot.documents.storage-directory=target/claimpilot-test-documents

