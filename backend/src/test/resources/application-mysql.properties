spring.datasource.url=${MYSQL_IT_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/claimpilot_db?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${MYSQL_IT_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${MYSQL_IT_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
claimpilot.documents.storage-directory=target/claimpilot-mysql-it-documents
