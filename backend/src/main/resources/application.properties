# ===================================================================
# ClaimPilot AI Backend Configuration
# ===================================================================

spring.application.name=claimpilot-backend
spring.main.banner-mode=off
server.port=${SERVER_PORT:8081}

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MySQL 8 DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/claimpilot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Settings
claimpilot.jwt.secret=${JWT_SECRET:claimpilot-default-secure-dev-signing-key-32chars}
claimpilot.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration for Frontend
claimpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
claimpilot.documents.storage-directory=${CLAIMPILOT_DOCUMENTS_DIR:./data/documents}
claimpilot.documents.max-file-size-bytes=${CLAIMPILOT_DOCUMENTS_MAX_FILE_SIZE_BYTES:20971520}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Logging
logging.level.root=INFO
logging.level.com.claimpilot=INFO
logging.level.org.springframework.security=INFO

